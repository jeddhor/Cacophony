[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cacophony"
version = "0.1.0"
description = "Synthetic data generation studio - a synthetic reality compiler"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Jason Tripp" }]
keywords = ["synthetic-data", "fake-data", "test-data", "llm", "generation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]

# Upper bounds on everything that can break silently. They exist because an
# unbounded range let a resolver pick a Starlette and httpx pair whose TestClient
# deadlocks, which took out a hundred and nine tests in somebody else's
# environment while passing in ours. A bound that has to be raised deliberately
# every so often is cheaper than a combination nobody chose.
dependencies = [
    "pydantic>=2.7,<3",
    "PyYAML>=6.0,<7",
    "Faker>=25.0,<41",
    "numpy>=1.26,<3",
    "typer>=0.12,<1",
    "rich>=13.7,<16",
    "httpx>=0.27,<0.29",
    "SQLAlchemy>=2.0,<3",
    "ruamel.yaml>=0.18,<0.19",
]

[project.optional-dependencies]
parquet = ["pyarrow>=16.0,<26"]
keyring = ["keyring>=25.0,<26"]
# Starlette is pinned directly although FastAPI brings it: the TestClient that
# breaks is Starlette's, so the constraint belongs where it can be read.
api = [
    "fastapi>=0.115,<1",
    "starlette>=0.40,<2",
    "uvicorn[standard]>=0.30,<1",
    "websockets>=13.0,<18",
]
kafka = ["aiokafka>=0.10,<1"]
dev = [
    "pytest>=8.0,<10",
    "fastapi>=0.115,<1",
    "starlette>=0.40,<2",
    "uvicorn[standard]>=0.30,<1",
    "pytest-cov>=5.0,<8",
    "hypothesis>=6.100,<7",
    "ruff>=0.5,<1",
    "mypy>=1.10,<3",
    "types-PyYAML>=6.0,<7",
    # Reads the built manual to count its pages, so no claim about its length is
    # typed by hand. See tools/conformance.py.
    "pypdf>=5.0,<7",
]

[project.scripts]
cacophony = "cacophony.cli.main:run"

[project.urls]
Homepage = "https://github.com/jeddhor/Cacophony"

[tool.hatch.build.targets.wheel]
packages = ["backend/cacophony"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
addopts = "-q --strict-markers"
markers = [
    "scale: slow tests that generate large record counts",
    # Skipped unless CACOPHONY_TEST_INVOKEAI / _PIPER / _OLLAMA name a server.
    # A suite that needs a GPU is a suite nobody runs; an adapter that has
    # never met its server is one nobody should trust either.
    "live: provider contract tests that need a real backend",
    "slow: timing-sensitive tests that measure a stream over seconds",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "B008",   # typer uses function calls in argument defaults by design
    "RUF012", # mutable class attrs are fine for our registries
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
# The edge-case catalogue (design document section 79) is a deliberate
# collection of characters that look like other characters: fullwidth Latin,
# dotless I, mathematical alphanumerics, non-breaking spaces. Ambiguity is the
# feature under test, so the ambiguity check has nothing useful to say here.
"backend/cacophony/simulation/edges.py" = ["RUF001", "RUF003"]
# And the tests that exercise it, for the same reason.
"tests/test_assurance.py" = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
mypy_path = "backend"
packages = ["cacophony"]
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true
