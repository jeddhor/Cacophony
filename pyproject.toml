[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cacophony"
version = "0.1.0"
description = "Synthetic data generation studio - a synthetic reality compiler"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Cacophony" }]
keywords = ["synthetic-data", "fake-data", "test-data", "llm", "generation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]

dependencies = [
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "Faker>=25.0",
    "numpy>=1.26",
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "SQLAlchemy>=2.0",
    "ruamel.yaml>=0.18",
]

[project.optional-dependencies]
parquet = ["pyarrow>=16.0"]
keyring = ["keyring>=25.0"]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "websockets>=13.0"]
dev = [
    "pytest>=8.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]

[project.scripts]
cacophony = "cacophony.cli.main:run"

[project.urls]
Homepage = "https://github.com/jeddhor/Cacophony"

[tool.hatch.build.targets.wheel]
packages = ["backend/cacophony"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
addopts = "-q --strict-markers"
markers = [
    "scale: slow tests that generate large record counts",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "B008",   # typer uses function calls in argument defaults by design
    "RUF012", # mutable class attrs are fine for our registries
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
mypy_path = "backend"
packages = ["cacophony"]
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true
