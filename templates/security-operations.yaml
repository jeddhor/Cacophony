# Security Operations
# Design document section 71: the sophisticated starter project.
#
# Section 71 names twelve entities and eight scenarios. The scenarios are now
# executed rather than merely declared, which is what makes this dataset worth
# generating: authentication is a *history* - each identity's sign-ins belong
# to that identity, arrive in order, and follow the working week - and a small
# fraction of those identities are having a bad month.
#
#     cacophony generate templates/security-operations.yaml -n 20000 -d out/
#
#     jq -r 'select(.scenario != null) | [.scenario, .phase, .result] | @tsv' \
#         out/authentication.jsonl | sort | uniq -c
#
# The compromised accounts are a fraction of a per cent of the population, they
# are the same accounts on every run, and their sign-ins fail far more often
# than everyone else's - which is what a detection rule is supposed to notice.

project:
  name: Security Operations
  description: >
    Endpoints, users, authentication activity and security findings for a
    fictional enterprise. Addresses come from documentation ranges, so nothing
    generated here can point at a real host.
  seed: 31337
  locale: en_US
  profile: balanced

# When all of this happened (design document section 25). Activity follows the
# working week and the working day, so a plot of sign-ins per hour looks like an
# office rather than like a random number generator.
timeline:
  start: "2026-01-01"
  end: "2026-04-01"
  shape: business_hours
  holidays: ["2026-01-01", "2026-02-16"]
  holiday_weight: 0.05

# Real data is ugly (section 24). `realistic` is a light touch - two per cent of
# records lose a field, a handful get mangled text - and every defect is
# recorded in provenance so a pipeline test can tell deliberate damage from its
# own bugs. Raise it to `messy` or `hostile_qa` to find out what breaks.
chaos:
  preset: realistic

entities:

  # ------------------------------------------------------------------ #
  user:
    count: 4800
    description: A workforce identity.
    primary_key: user_id

    fields:
      user_id:
        type: string
        generator: sequence
        format: "USR-{000000}"
        unique: true

      upn:
        type: email
        generator: faker
        provider: company_email

      display_name:
        type: string
        generator: faker
        provider: name

      department:
        type: enum
        generator: weighted
        choices:
          Engineering: 26
          Sales: 17
          Operations: 15
          Finance: 11
          Support: 11
          Marketing: 8
          Human Resources: 6
          Legal: 3
          Security: 3

      privilege_tier:
        type: enum
        semantic: "How much access this identity carries"
        generator: weighted
        choices:
          standard: 86
          elevated: 9
          administrator: 4
          service_account: 1

      mfa_enrolled:
        type: boolean
        generator: boolean
        probability: 0.91

      account_enabled:
        type: boolean
        generator: boolean
        probability: 0.96

      created_at:
        type: datetime
        generator: datetime
        start: "2014-01-01T00:00:00"
        end: "2026-01-01T00:00:00"

  # ------------------------------------------------------------------ #
  device:
    count: 8000
    description: A managed endpoint.
    primary_key: device_id

    fields:
      device_id:
        type: string
        generator: sequence
        format: "DEV-{000000}"
        unique: true

      hostname:
        type: hostname
        generator: pattern
        pattern: "ep-{a-z:2}{0000}"

      os_platform:
        type: enum
        generator: weighted
        choices:
          Windows: 67
          macOS: 18
          Linux: 13
          Other: 2

      os_version:
        type: string
        generator: weighted
        choices:
          "10.0.22631": 41
          "10.0.19045": 14
          "15.3": 12
          "14.7": 6
          "24.04": 9
          "22.04": 5
          "unknown": 13

      ip_address:
        type: ip_address
        generator: ip
        network: 10.64.0.0/12

      mac_address:
        type: mac_address
        generator: mac

      edr_installed:
        type: boolean
        generator: boolean
        probability: 0.93

      disk_encrypted:
        type: boolean
        generator: boolean
        probability: 0.89

      last_seen_at:
        type: datetime
        generator: datetime
        start: "2026-01-01T00:00:00"
        end: "2026-02-01T00:00:00"
        business_hours: true

  # ------------------------------------------------------------------ #
  authentication:
    # Enough to see the shape of a quarter's activity in about half a minute.
    # Raise it: the simulation costs the same per record at any scale.
    count: 120000
    description: >
      A sign-in event. Every one belongs to a user, arrives in chronological
      order within that user's own history, and follows the project timeline -
      which is what makes anomaly detection over this dataset a meaningful
      exercise rather than a test of the random number generator.

    # Section 25 and 26: these are not independent rows, they are each
    # identity's history. `skewed` because a few accounts sign in constantly
    # and most barely at all.
    simulation:
      subject: user
      distribution: skewed
      skew: 1.9
      minimum: 3

    fields:
      event_id:
        type: uuid

      # The k-th of this user's n sign-ins, placed where the k-th sign-in
      # would fall. No sorting, and the same answer on a resumed run.
      timestamp:
        type: datetime
        generator: event_time

      user:
        generator: subject
        expose: true

      upn:
        type: email
        generator: template
        template: "{user.upn}"

      source_ip:
        type: ip_address
        # Documentation range - see design document section 62.
        generator: ip

      application:
        type: enum
        generator: weighted
        choices:
          Microsoft 365: 34
          VPN Gateway: 19
          Salesforce: 12
          Internal Wiki: 11
          Jira: 9
          GitHub Enterprise: 8
          Expense Portal: 4
          Admin Console: 3

      auth_method:
        type: enum
        generator: weighted
        choices:
          password_plus_mfa: 71
          password_only: 16
          certificate: 7
          passwordless: 6

      result:
        type: enum
        generator: weighted
        choices:
          success: 93
          failure_bad_password: 5
          failure_mfa_denied: 1
          failure_account_locked: 1

      failure_reason:
        type: string
        nullable: true
        null_probability: 0.93
        generator: weighted
        choices:
          InvalidUserNameOrPassword: 58
          MfaDenied: 17
          UserAccountLocked: 12
          ConditionalAccessBlocked: 9
          ExpiredPassword: 4

      user_agent:
        type: string
        generator: faker
        provider: user_agent

      risk_score:
        type: integer
        semantic: "Sign-in risk, 0 (benign) to 100 (certainly malicious)"
        generator: distribution
        distribution: beta
        alpha: 1.4
        beta: 12
        min: 0
        max: 100

      # What makes the incident findable. Without these the dataset contains a
      # compromise nobody can point at, which is fine for a detection exercise
      # and useless for checking the generator did what it was asked.
      scenario:
        type: string
        nullable: true
        generator: scenario
        report: name

      phase:
        type: string
        nullable: true
        generator: scenario
        report: phase

  # ------------------------------------------------------------------ #
  security_finding:
    count: 25000
    description: A detection raised against a device or identity.
    primary_key: finding_id

    fields:
      finding_id:
        type: string
        generator: sequence
        format: "FND-{0000000}"
        unique: true

      detected_at:
        type: datetime
        generator: datetime
        start: "2026-01-01T00:00:00"
        end: "2026-02-01T00:00:00"

      rule_name:
        type: string
        generator: weighted
        choices:
          Suspicious PowerShell Encoded Command: 14
          Impossible Travel: 11
          Credential Dumping Attempt: 9
          Anomalous Data Egress: 9
          Multiple Failed Sign-ins: 16
          Malicious File Quarantined: 12
          Unusual Process Ancestry: 8
          Persistence via Scheduled Task: 7
          Disabled Security Tooling: 5
          Lateral Movement via SMB: 5
          Rare Parent-Child Process: 4

      severity:
        type: enum
        generator: weighted
        choices:
          informational: 34
          low: 31
          medium: 24
          high: 9
          critical: 2

      confidence:
        type: integer
        generator: distribution
        distribution: normal
        mean: 68
        stddev: 18
        min: 5
        max: 100

      cvss_score:
        type: float
        semantic: "CVSS-like base score"
        generator: distribution
        distribution: beta
        alpha: 3.5
        beta: 3.0
        min: 0.0
        max: 10.0
        precision: 1

      cve_id:
        type: string
        semantic: "A CVE-shaped identifier. Fictional - these do not exist."
        nullable: true
        null_probability: 0.72
        generator: pattern
        pattern: "CVE-20{00}-{0000}"

      mitre_technique:
        type: string
        generator: pattern
        pattern: "T{0000}"

      file_hash:
        type: string
        semantic: "A SHA-256-shaped value"
        nullable: true
        null_probability: 0.55
        generator: pattern
        pattern: "{0-9:64}"

      status:
        type: enum
        generator: weighted
        choices:
          new: 18
          triaged: 22
          investigating: 11
          resolved_true_positive: 12
          resolved_false_positive: 34
          suppressed: 3

  # ------------------------------------------------------------------ #
  # Section 71's remaining entities. Each one exists because a scenario or a
  # question needs it: process telemetry for malware, connection volumes for
  # exfiltration, an analyst and a ticket for what happens after the alert.
  # ------------------------------------------------------------------ #

  organisation:
    count: 4
    description: A legal entity inside the tenant. Users belong to one.
    primary_key: org_id

    fields:
      org_id:
        type: string
        generator: sequence
        format: "ORG-{00}"
        unique: true

      name:
        type: string
        # `cycle` rather than `random`: a catalogue holds each of its rows
        # once, and four subsidiaries drawn at random would repeat.
        generator: lookup
        mode: cycle
        values:
          - Northwind Holdings
          - Northwind Manufacturing
          - Northwind Logistics EU
          - Northwind Research

      domain:
        type: hostname
        generator: lookup
        mode: cycle
        values: [example.com, mfg.example.net, logistics.example.org, research.example.com]

      region:
        type: enum
        generator: lookup
        mode: cycle
        values: [us-east, eu-west, eu-central, apac]

      employee_count:
        type: integer
        generator: random
        min: 180
        max: 2600

  # ------------------------------------------------------------------ #
  application:
    count: 8
    description: >
      The application catalogue. Sign-ins name these by their usage
      distribution; this is the inventory behind those names.
    primary_key: app_id

    fields:
      app_id:
        type: string
        generator: sequence
        format: "APP-{000}"
        unique: true

      name:
        type: string
        generator: lookup
        mode: cycle
        values:
          - Microsoft 365
          - VPN Gateway
          - Salesforce
          - Internal Wiki
          - Jira
          - GitHub Enterprise
          - Expense Portal
          - Admin Console

      criticality:
        type: enum
        generator: weighted
        choices: {tier_1: 3, tier_2: 3, tier_3: 2}

      internet_facing:
        type: boolean
        generator: boolean
        probability: 0.62

      sso_enabled:
        type: boolean
        generator: boolean
        probability: 0.87

      owner_department:
        type: enum
        generator: weighted
        choices: {Engineering: 3, Operations: 2, Finance: 1, Security: 2}

  # ------------------------------------------------------------------ #
  network_connection:
    count: 40000
    description: >
      An egress flow from a managed endpoint. The volumes are what make
      `insider_exfiltration` findable: one identity's ordinary week is
      megabytes, and the week that matters is not.

    simulation:
      subject: device
      distribution: skewed
      skew: 1.7
      minimum: 2

    fields:
      connection_id:
        type: uuid

      timestamp:
        type: datetime
        generator: event_time

      device:
        generator: subject
        expose: true

      hostname:
        type: hostname
        generator: template
        template: "{device.hostname}"

      destination_ip:
        type: ip_address
        generator: ip

      destination_port:
        type: integer
        generator: weighted
        choices: {443: 68, 80: 12, 22: 6, 3389: 4, 8443: 4, 53: 3, 445: 3}

      protocol:
        type: enum
        generator: weighted
        choices: {tcp: 92, udp: 8}

      direction:
        type: enum
        generator: weighted
        choices: {outbound: 88, inbound: 12}

      bytes_sent:
        type: integer
        semantic: "Bytes the endpoint sent. Heavily skewed - most flows are small."
        generator: distribution
        distribution: lognormal
        mean: 9.2
        stddev: 1.6
        min: 64
        max: 40000000

      bytes_received:
        type: integer
        generator: distribution
        distribution: lognormal
        mean: 10.1
        stddev: 1.5
        min: 64
        max: 80000000

      blocked:
        type: boolean
        generator: boolean
        probability: 0.03

      scenario:
        type: string
        nullable: true
        generator: scenario
        report: name

  # ------------------------------------------------------------------ #
  endpoint_event:
    count: 40000
    description: >
      Process telemetry from the endpoint agent. `malware_infection` is
      expressed here - execution, then persistence, then defence evasion -
      which is why that scenario could not be enabled before.

    simulation:
      subject: device
      distribution: skewed
      skew: 1.6
      minimum: 2

    fields:
      event_id:
        type: uuid

      timestamp:
        type: datetime
        generator: event_time

      device:
        generator: subject
        expose: true

      process_name:
        type: string
        generator: weighted
        choices:
          chrome.exe: 22
          teams.exe: 14
          explorer.exe: 12
          svchost.exe: 11
          powershell.exe: 9
          outlook.exe: 9
          code.exe: 7
          cmd.exe: 6
          python.exe: 5
          rundll32.exe: 3
          wmic.exe: 2

      parent_process:
        type: string
        generator: weighted
        choices:
          explorer.exe: 41
          services.exe: 24
          svchost.exe: 17
          cmd.exe: 9
          winlogon.exe: 9

      command_line:
        type: string
        semantic: "The command line, truncated the way an agent truncates it"
        generator: template
        template: "{process_name} --profile {device.hostname}"

      integrity_level:
        type: enum
        generator: weighted
        choices: {medium: 74, high: 21, system: 4, low: 1}

      signed:
        type: boolean
        generator: boolean
        probability: 0.93

      action:
        type: enum
        generator: weighted
        choices: {process_created: 79, process_terminated: 17, blocked: 3, quarantined: 1}

      scenario:
        type: string
        nullable: true
        generator: scenario
        report: name

      phase:
        type: string
        nullable: true
        generator: scenario
        report: phase

  # ------------------------------------------------------------------ #
  analyst:
    count: 24
    description: Somebody who works the queue.
    primary_key: analyst_id

    fields:
      analyst_id:
        type: string
        generator: sequence
        format: "AN-{000}"
        unique: true

      name:
        type: string
        generator: faker
        provider: name

      email:
        type: email
        generator: faker
        provider: company_email

      tier:
        type: enum
        generator: weighted
        choices: {tier_1: 12, tier_2: 8, tier_3: 4}

      shift:
        type: enum
        generator: weighted
        choices: {days: 10, evenings: 8, nights: 6}

      specialisation:
        type: enum
        generator: weighted
        choices: {endpoint: 8, identity: 6, network: 5, cloud: 5}

  # ------------------------------------------------------------------ #
  alert:
    count: 3500
    description: What a detection rule raised, before anyone decided anything.
    primary_key: alert_id

    fields:
      alert_id:
        type: string
        generator: sequence
        format: "ALT-{000000}"
        unique: true

      finding:
        generator: reference
        entity: security_finding
        distribution: skewed
        skew: 1.4

      rule_name:
        type: string
        generator: template
        template: "{finding.rule_name}"

      severity:
        type: enum
        generator: template
        template: "{finding.severity}"

      raised_at:
        type: datetime
        generator: datetime
        start: "2026-01-01T00:00:00"
        end: "2026-04-01T00:00:00"

      source:
        type: enum
        generator: weighted
        choices: {edr: 41, siem: 33, email_gateway: 14, cloud_posture: 12}

      status:
        type: enum
        generator: weighted
        choices: {new: 21, triaged: 28, escalated: 12, closed_benign: 31, closed_actioned: 8}

      assigned_to:
        generator: reference
        entity: analyst
        nullable: true
        null_probability: 0.18

  # ------------------------------------------------------------------ #
  incident:
    count: 300
    description: An alert somebody decided was real, and what happened next.
    primary_key: incident_id

    fields:
      incident_id:
        type: string
        generator: sequence
        format: "INC-{00000}"
        unique: true

      alert:
        generator: reference
        entity: alert

      opened_at:
        type: datetime
        generator: datetime
        start: "2026-01-01T00:00:00"
        end: "2026-04-01T00:00:00"

      title:
        type: string
        generator: template
        template: "{alert.rule_name} on {alert.source}"

      category:
        type: enum
        generator: weighted
        choices:
          credential_compromise: 26
          malware: 21
          phishing: 19
          data_loss: 12
          policy_violation: 12
          denial_of_service: 6
          insider_threat: 4

      severity:
        type: enum
        generator: weighted
        choices: {low: 34, medium: 41, high: 19, critical: 6}

      lead_analyst:
        generator: reference
        entity: analyst

      status:
        type: enum
        generator: weighted
        choices: {open: 14, contained: 17, eradicated: 12, closed: 57}

      time_to_contain_minutes:
        type: integer
        semantic: "Minutes from opening to containment"
        generator: distribution
        distribution: lognormal
        mean: 4.4
        stddev: 1.1
        min: 4
        max: 20000

      sla_breached:
        type: boolean
        generator: boolean
        probability: 0.17

  # ------------------------------------------------------------------ #
  ticket:
    count: 800
    description: The work an incident generated, in the queue people actually use.
    primary_key: ticket_id

    fields:
      ticket_id:
        type: string
        generator: sequence
        format: "SOC-{000000}"
        unique: true

      incident:
        generator: reference
        entity: incident
        distribution: skewed
        skew: 1.2

      opened_at:
        type: datetime
        generator: template
        template: "{incident.opened_at}"

      queue:
        type: enum
        generator: weighted
        choices: {soc_triage: 44, endpoint_ops: 21, identity_ops: 18, network_ops: 17}

      priority:
        type: enum
        generator: weighted
        choices: {p1: 6, p2: 18, p3: 44, p4: 32}

      assignee:
        generator: reference
        entity: analyst

      state:
        type: enum
        generator: weighted
        choices: {open: 16, in_progress: 19, waiting_on_user: 11, resolved: 44, cancelled: 10}

      resolution:
        type: string
        nullable: true
        null_probability: 0.31
        generator: weighted
        choices:
          Contained and credentials reset: 24
          False positive - approved administrative activity: 27
          Endpoint reimaged: 14
          Rule tuned, no action required: 19
          Escalated to incident response retainer: 9
          Duplicate of an existing incident: 7

# Section 17's scenarios, executed rather than declared.
#
# A scenario selects *subjects* - identities, not records - deterministically
# from the project seed, so the same accounts are compromised on every run and
# every entity that references them agrees about who was involved. `window`
# places the incident inside each subject's own history; `phases` order what
# happens within it; `effects` are applied after normal generation, so a
# scenario composes with every generator rather than having to be understood by
# each one.
#
# A mapping effect is a weighted choice: an incident that flipped every record
# to the same value would be detectable by accident rather than by analysis.
#
# `window` is a fraction of the subject's own history, which - because events
# are laid out by timeline quantile - is the same calendar moment for every
# affected identity, however many sign-ins each of them has. So an incident
# declared at 0.62 lands in the same week for a user with sixty sign-ins and a
# user with fifteen hundred, which is what makes it an *incident* rather than a
# per-user coincidence.
scenarios:

  # Baseline. Every identity, all period, no effects - it exists to say that
  # the office-hours weighting is a deliberate choice and not an accident.
  normal_workday:
    description: Baseline weekday activity with office-hours weighting.
    applies_to: [authentication]
    enabled: true

  # Section 17's timeline, compressed into one identity's history: access,
  # then execution, then movement, then encryption.
  ransomware:
    description: >
      The section 17 timeline - sign-in, payload execution, credential access,
      lateral movement, then encryption - concentrated in a short window.
    applies_to: [authentication]
    affects_fraction: 0.004
    enabled: true
    parameters:
      subject: user
      # Sixty-two per cent of the way through the period, lasting twelve - long
      # enough for all four phases to appear in a busy account's history.
      window: {at: 0.62, duration: 0.12}
      rate_multiplier: 4.0
      effects:
        risk_score: 88
      phases:
        - name: initial_access
          effects:
            application: VPN Gateway
            result: {success: 70, failure_bad_password: 30}
            auth_method: password_only
        - name: credential_access
          effects:
            result: {success: 40, failure_bad_password: 55, failure_mfa_denied: 5}
            risk_score: 94
        - name: lateral_movement
          effects:
            application: {Admin Console: 60, Internal Wiki: 25, GitHub Enterprise: 15}
            result: success
            risk_score: 97
        - name: encryption
          effects:
            application: Admin Console
            result: success
            risk_score: 99

  # Many accounts, few passwords, one source: the failures are the signal.
  password_spray:
    description: One source address attempting many accounts with few passwords.
    applies_to: [authentication]
    affects_fraction: 0.02
    enabled: true
    parameters:
      subject: user
      window: {at: 0.30, duration: 0.05}
      rate_multiplier: 2.0
      effects:
        result: {failure_bad_password: 88, success: 6, failure_account_locked: 6}
        failure_reason: InvalidUserNameOrPassword
        auth_method: password_only
        risk_score: 72

  # A successful sign-in that should not have been possible.
  impossible_travel:
    description: Successful sign-ins from geographically incompatible locations.
    applies_to: [authentication]
    affects_fraction: 0.01
    enabled: true
    parameters:
      subject: user
      window: {at: 0.45, duration: 0.02}
      effects:
        result: success
        auth_method: {password_only: 70, password_plus_mfa: 30}
        risk_score: 81

  # Credentials harvested, then used: the sign-in itself looks ordinary, which
  # is the point.
  phishing:
    description: Credential harvesting from a delivered message.
    applies_to: [authentication]
    affects_fraction: 0.03
    enabled: true
    parameters:
      subject: user
      window: {at: 0.20, duration: 0.06}
      effects:
        result: {success: 82, failure_mfa_denied: 18}
        risk_score: 64

  # The three that used to be declared and off. They needed entities this
  # template did not ship - process telemetry and egress volumes - because a
  # scenario that cannot express itself in the fields available is a scenario
  # in name only. Those entities exist now, and so do these.
  malware_infection:
    description: Payload execution, then persistence, then defence evasion.
    applies_to: [endpoint_event]
    affects_fraction: 0.006
    enabled: true
    parameters:
      subject: device
      window: {at: 0.55, duration: 0.08}
      rate_multiplier: 3.0
      phases:
        - name: execution
          effects:
            process_name: {powershell.exe: 62, wscript.exe: 24, rundll32.exe: 14}
            parent_process: outlook.exe
            signed: false
            integrity_level: medium
        - name: persistence
          effects:
            process_name: {schtasks.exe: 58, reg.exe: 42}
            parent_process: cmd.exe
            integrity_level: high
            action: process_created
        - name: defence_evasion
          effects:
            process_name: {sc.exe: 47, powershell.exe: 33, wmic.exe: 20}
            signed: false
            integrity_level: system
            action: {process_created: 64, blocked: 36}

  # Only on the sign-ins, deliberately. A scenario selects *subjects*, and this
  # one's subject is an identity; endpoint telemetry is keyed by device, so
  # applying it there would mark a different set of subjects and call them the
  # same incident. Movement between endpoints is visible here as an identity
  # authenticating to hosts it has no business on.
  lateral_movement:
    description: Authenticated movement between endpoints after initial access.
    applies_to: [authentication]
    affects_fraction: 0.002
    enabled: true
    parameters:
      subject: user
      window: {at: 0.71, duration: 0.04}
      rate_multiplier: 2.5
      effects:
        result: success
        auth_method: password_only
        risk_score: 86
        application: {Admin Console: 55, Internal Wiki: 25, GitHub Enterprise: 20}

  insider_exfiltration:
    description: Sustained abnormal data egress by a legitimate identity.
    applies_to: [network_connection]
    affects_fraction: 0.003
    enabled: true
    parameters:
      subject: device
      window: {at: 0.83, duration: 0.09}
      rate_multiplier: 2.2
      effects:
        direction: outbound
        # Two orders of magnitude above the ordinary flow, which is what makes
        # it a finding rather than a busy afternoon.
        bytes_sent: {900000000: 40, 420000000: 35, 180000000: 25}
        destination_port: {443: 82, 22: 18}
        blocked: false

outputs:
  siem:
    format: jsonl
    path: out/secops
  analytics:
    format: parquet
    path: out/secops-analytics
    partition_by: [year, month, day]
