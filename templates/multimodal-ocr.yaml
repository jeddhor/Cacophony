# Multimodal OCR
# Design document sections 23 and 70: scanned documents, and the text that
# produced them.
#
# Every invoice here exists twice - as a page image that looks like it came off
# a flatbed, and as the exact text that was rendered into it. That pairing is
# the whole point. An OCR pipeline needs an answer key, and this is the one
# kind of dataset that can honestly ship one: the ground truth is not a
# transcription somebody made, it is the input.
#
#     pip install 'cacophony[ocr]'
#     cacophony generate templates/multimodal-ocr.yaml -n 200 -d out/
#
#     jq -r '.[] | [.path, .metadata.text] | @tsv' out/assets/manifest.jsonl
#
# The pages are degraded on purpose - skewed a degree, blurred, speckled,
# greyed - because a dataset of perfect pages tests nothing. The hard part of
# document processing is the photocopier.

project:
  name: Multimodal OCR
  description: >
    Scanned supplier invoices with their ground-truth text, for training and
    testing document recognition. Needs no GPU and no model: the pages are
    rendered and spoiled locally.
  seed: 90210
  locale: en_US
  provenance: field

entities:

  # ------------------------------------------------------------------ #
  supplier:
    count: 40
    description: Who sent the invoice.
    primary_key: supplier_id

    fields:
      supplier_id:
        type: string
        generator: sequence
        format: "SUP-{0000}"
        unique: true

      name:
        type: string
        generator: faker
        provider: company

      address:
        type: string
        generator: faker
        provider: street_address

      city:
        type: string
        generator: faker
        provider: city

      vat_number:
        type: string
        semantic: "A VAT-shaped identifier. Fictional."
        generator: pattern
        pattern: "GB{000000000}"

      terms_days:
        type: integer
        generator: weighted
        choices: {30: 6, 14: 3, 60: 2, 7: 1}

  # ------------------------------------------------------------------ #
  invoice:
    count: 400
    description: >
      One invoice, as a page image and as the text that made it. The scan is
      what a pipeline reads; `document_text` is what it should have read.
    primary_key: invoice_number

    fields:
      invoice_number:
        type: string
        generator: sequence
        format: "INV-2026-{00000}"
        unique: true

      supplier:
        generator: reference
        entity: supplier
        distribution: skewed
        skew: 1.4

      supplier_name:
        type: string
        generator: template
        template: "{supplier.name}"

      issued_on:
        type: date
        generator: datetime
        start: "2026-01-02"
        end: "2026-03-31"

      currency:
        type: enum
        generator: weighted
        choices: {GBP: 6, EUR: 3, USD: 2}

      line_one_description:
        type: string
        generator: weighted
        choices:
          Platform subscription: 8
          Professional services: 6
          Hardware maintenance: 4
          Licence renewal: 4
          Onboarding and training: 3
          Data migration: 2

      line_one_quantity:
        type: integer
        generator: random
        min: 1
        max: 24

      line_one_unit_price:
        type: decimal
        generator: distribution
        distribution: lognormal
        mean: 4.4
        stddev: 0.7
        min: 12.0
        max: 4000.0
        precision: 2

      subtotal:
        type: decimal
        generator: expression
        expression: "round(line_one_quantity * line_one_unit_price, 2)"

      tax:
        type: decimal
        semantic: "VAT at 20%"
        generator: expression
        # `* 20 / 100` rather than `* 0.2`: these are decimals, and Python
        # will not multiply a Decimal by a float - which is the right refusal,
        # because money and binary floats disagree in the last place.
        expression: "round(subtotal * 20 / 100, 2)"

      total:
        type: decimal
        generator: expression
        expression: "round(subtotal + tax, 2)"

      # The text of the page, as a field of its own: the answer key belongs in
      # the data as well as in the manifest, so a training set can be built
      # from the records without reading the asset metadata.
      document_text:
        type: text
        generator: template
        template: |
          INVOICE  {invoice_number}

          {supplier.name}
          {supplier.address}
          {supplier.city}
          VAT {supplier.vat_number}

          Issued: {issued_on}          Terms: {supplier.terms_days} days

          Description                          Qty        Amount
          {line_one_description}               {line_one_quantity}    {subtotal}

          Subtotal                                        {subtotal}
          VAT at 20%                                      {tax}
          Total due ({currency})                          {total}

      # The same text, rendered and then spoiled. `rasterise` is section 23's
      # optional half; without the `ocr` extra installed this field explains
      # what to install rather than failing obscurely.
      scan:
        type: file
        generator: document
        rasterise: true
        dpi: 150
        image_format: jpeg
        page_size: a4
        font_size: 10.5
        template: "{document_text}"
        degrade:
          rotate: 0.7
          blur: 0.4
          speckle: 0.0004
          contrast: 0.88
          quality: 72

outputs:
  training_set:
    format: jsonl
    path: out/ocr
  # Everything but the text, for a pipeline that reads the images and should
  # not be able to see the answers.
  images_only:
    format: csv
    path: out/ocr-index
    entities: [invoice]
