  - section: 54
    state: implemented
    note: >
      Every registered format, the project's declared output layouts, the
      provider requirements the run actually has, and an estimate in 69's own
      units - tokens and peak memory rather than a guess.
  - section: 55
    state: implemented
    note: >
      Every figure the section lists, live over a socket: progress, records and
      tokens a second, disk throughput, images a minute, audio minutes a
      minute, and per-entity counters. Bytes are attributed to the destination
      that grew, so entities sharing one SQLite file are not counted three
      times.
  - section: 56
    state: partial
    note: >
      A finished run reports what it stored, and reports it as final - elapsed
      time is how long it took rather than how long ago it was, and a resumed
      run's summary describes the whole dataset rather than its last attempt.
      Rejected
      records cannot be browsed: they are counted by category and named in a
      run's events, but nothing keeps the records themselves.
  - section: 57
    state: implemented
    note: >
      All six categories. Logical is `assertions:` on an entity, evaluated with
      the same restricted evaluator as everything else in a schema and compiled
      when the schema is, so a broken rule is a schema error rather than a
      per-record one. Semantic is opt-in and off by default - section 57 asks
      for that because of cost, and there is a second reason recorded against
      67 - and its verdicts are reported as opinions with the judging model
      named. An answer that is not a verdict is counted as unreadable rather
      than as doubt.
  - {section: 58, state: implemented}
  - section: 59
    state: partial
    note: "Exact, normalised, MinHash and fuzzy detection are built."
    refuses:
      - item: "embedding-based detection"
        why: >
          It needs an embedding provider and no adapter offers one, so it would
          be a configuration option that never worked.
  - {section: 60, state: implemented, note: "Five provenance levels."}
  - section: 61
    state: partial
    note: >
      Optional detectors for card numbers that pass a Luhn check, issuable
      government identifiers, domains outside the reserved ranges, routable
      IPv4 and IPv6 addresses and dialable telephone numbers, under a
      report/warn/block policy. Where each one looks is deliberate and the
      manual states it: scanning free prose for dotted quads reports every
      version string ever written. A field may be labelled, and labelled
      findings are reported under that label. Turned on the shipped templates,
      they immediately found one: Faker's safe mode rewrote domains and not
      phone numbers.
    refuses:
      - item: "detecting suspiciously realistic public identities"
        why: >
          Deciding whether a generated name belongs to a real person needs a list
          of real people, which is a thing this project should not build and
          should not ship. Section 61's other three detectors are decidable from
          the value itself and are built; this one is not, and pretending
          otherwise would be worse than declining it.
      - item: "claiming the output is privacy-preserving"
        why: >
          Section 61 says not to claim it without an actual privacy technique,
          and detection is not one. It catches leakage, which is a smaller and
          different thing, and the documentation says so.
  - {section: 62, state: implemented}
  - section: 63
    state: implemented
    note: >
      Project files hold logical secret ids and are refused if they hold
      anything that looks like a credential. All three of the section's places
      exist: resolution reads an explicit override, then the environment, then
      an encrypted store (scrypt and AES-GCM, `cacophony secrets`), then the OS
      keychain. There is deliberately no default passphrase.
  - section: 64
    state: partial
    note: >
      Six of the seven settings exist and are enforced: workers, provider
      concurrency, batch size, the disk threshold (a run below the floor does
      not start), the request timeout (a ceiling on every provider's own), and
      the retry count, which now means retries rather than attempts. The
      memory ceiling is recorded rather than enforced, and there is no CPU
      ceiling - a limit this process cannot impose on itself without lying
      about it.
  - section: 65
    state: implemented
    note: >
      All six policies - abort, retry, skip, placeholder, incomplete, report -
      per run and per field: `on_failure:` on a field governs what happens when
      that generator cannot produce a value, and the run's policy applies to
      everything that does not say. Whether an invalid *record* is kept stays a
      run-wide decision, because that is a property of the record rather than
      of any one generator.
  - {section: 66, state: implemented}
  - section: 67
    state: partial
    note: >
      Validity, usability, clipping, speed, duplication and latency are
      measured. Section 57's optional semantic validation is the nearest thing
      to what is refused here, and it is deliberately a different instrument:
      it judges a sample of a run's output and names the judge, rather than
      scoring models against each other.
    refuses:
      - item: "semantic quality scoring"
        why: >
          It requires a judge model, which would make the benchmark depend on the
          kind of thing it is assessing. What is measurable is measured and named
          honestly instead.
  - section: 69
    state: partial
    note: >
      Tokens, storage and memory are estimated, and model calls are counted the
      way they are made rather than as records times model fields. Memory
      follows the batch size and worker count a run will actually use; what an
      estimate assumed is part of the estimate.
    refuses:
      - item: "GPU generation time"
        why: >
          It cannot be estimated without the provider saying how long a step
          takes on its hardware, and no adapter reports that. A number invented
          here would be a guess wearing a unit.
  - {section: 68, state: implemented}
  - section: 70
    state: partial
    note: >
      Eight templates, each asserted in the suite, covering seven of the
      section's list. The Multimodal OCR template is not among them - the
      shipped multimodal template generates support-call audio and badge
