  - {section: 7, state: implemented, note: "28 types."}
  - section: 8
    state: partial
    note: >
      29 of the 30 strategies are built. `lookup` reads inline values, CSV,
      JSON, text, Parquet, and the result of a query against a SQLite file, and
      `from_entity: employee.department` samples another entity by resolving a
      position rather than by holding a table.
    refuses:
      - item: "script"
        why: >
          A project file is shared, so a script field would make opening a schema
          equivalent to running its author's code. A restricted interpreter is a
          denylist, not a sandbox; the isolation that would work was measured and
          exists on one of three target platforms. Chapter 41 of the manual has
          the full reasoning, including what was tried.
