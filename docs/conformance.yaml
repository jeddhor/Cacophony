  - section: 67
    state: partial
    note: >
      Validity, usability, clipping, speed, duplication and latency are
      measured. Section 57's optional semantic validation is the nearest thing
      to what is refused here, and it is deliberately a different instrument:
      it judges a sample of a run's output and names the judge, rather than
      scoring models against each other.
    refuses:
      - item: "semantic quality scoring"
        why: >
          It requires a judge model, which would make the benchmark depend on the
          kind of thing it is assessing. What is measurable is measured and named
          honestly instead.
  - section: 69
    state: partial
    note: "Tokens, storage and memory are estimated."
    refuses:
      - item: "GPU generation time"
        why: >
          It cannot be estimated without the provider saying how long a step
          takes on its hardware, and no adapter reports that. A number invented
          here would be a guess wearing a unit.
