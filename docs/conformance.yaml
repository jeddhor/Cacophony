# Cacophony against its design document, section by section.
#
# Data rather than prose, because a claim nobody can check is how README came to
# say "165 pages" of a 173-page manual. `tools/conformance.py` renders this to
# CONFORMANCE.md, and a test asserts that every section of CACOPHONY.md appears
# here exactly once with a state from the four below.
#
#   implemented  built, and it does what the section describes
#   partial      built in part; the note says what is missing
#   deferred     in the design, not built, not refused
#   declined     deliberately not built; the note says why
#
# A section can be `implemented` and still carry a refusal: `refuses` lists the
# sub-items that were deliberately not built, which is where most of the honest
# disagreement with the document lives.

sections:
  - {section: 1, state: implemented, note: "Narrative. The product matches the summary."}
  - {section: 2, state: implemented, note: "Narrative."}
