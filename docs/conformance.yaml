  - section: 57
    state: implemented
    note: >
      All six categories. Logical is `assertions:` on an entity, evaluated with
      the same restricted evaluator as everything else in a schema. Semantic is
      opt-in and off by default - section 57 asks for that because of cost, and
      there is a second reason recorded against 67 - and its verdicts are
      reported as opinions with the judging model named.
  - {section: 58, state: implemented}
  - section: 59
    state: partial
    note: "Exact, normalised, MinHash and fuzzy detection are built."
    refuses:
      - item: "embedding-based detection"
        why: >
          It needs an embedding provider and no adapter offers one, so it would
          be a configuration option that never worked.
  - {section: 60, state: implemented, note: "Five provenance levels."}
  - section: 61
    state: partial
    note: >
      Optional detectors for card numbers that pass a Luhn check, issuable
      government identifiers, domains outside the reserved ranges, routable
      addresses and dialable telephone numbers, under a report/warn/block
      policy. A field may be labelled, and labelled findings are reported under
      that label. Turned on the shipped templates, they immediately found one:
      Faker's safe mode rewrote domains and not phone numbers.
    refuses:
      - item: "detecting suspiciously realistic public identities"
        why: >
          Deciding whether a generated name belongs to a real person needs a list
          of real people, which is a thing this project should not build and
          should not ship. Section 61's other three detectors are decidable from
          the value itself and are built; this one is not, and pretending
          otherwise would be worse than declining it.
      - item: "claiming the output is privacy-preserving"
        why: >
          Section 61 says not to claim it without an actual privacy technique,
          and detection is not one. It catches leakage, which is a smaller and
          different thing, and the documentation says so.
