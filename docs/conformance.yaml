  - section: 21
    state: partial
    note: >
      A support call is generated end to end - transcript, audio from that
      transcript, and a text transcript file beside it
      (templates/multimodal-support.yaml). What the section also asks for is
      not: distinct customer and agent voices within one call, composed turns,
      duration, sentiment and resolution fields, and timed alignment between
      the audio and the transcript.
  - section: 22
    state: implemented
    note: >
      Speech through Piper and an OpenAI-compatible adapter, a procedural voice
      that needs no server, and the section's non-speech audio - alarms,
      ambience, machine noise, notifications and a distortion pass - as the
      `sound` generator, synthesised rather than sampled so ten thousand alarms
      cost no GPU.
  - section: 23
    state: partial
    note: >
      Documents render to TXT, HTML and PDF from the record they describe. The
      section's optional extras - degrading a page and rasterising it into an
      image for OCR pipelines - are not built.
  - {section: 24, state: implemented}
  - section: 25
    state: partial
    note: >
      Business hours, weekday and holiday shaping, and seasonality. Per-subject
      timezones are not: a timeline is shaped in one clock, and parsing a
      timestamp discards its offset rather than carrying it.
  - {section: 26, state: implemented}
  - {section: 27, state: implemented}
  - {section: 28, state: implemented}
  - {section: 29, state: implemented}
  - {section: 30, state: implemented}
  - section: 31
    state: implemented
    note: >
      Everything streams, and the last structure whose size was the dataset -
      the set of values behind `unique: true` - is now bounded, spilling to a
      disk-backed index above a stated ceiling without giving up exactness.
  - section: 32
    state: implemented
    note: >
      A checkpoint holds the source position as well as the row count, because
      a schema that drops or duplicates records makes those different numbers.
      A resumed run recompiles the revision it recorded, keeps the paths it
      resolved when it started, opens a new part rather than appending to a
      torn one, and reads back the values a `unique:` field already used where
      the format allows it - and says so where it does not.
  - section: 33
    state: partial
    note: >
      The section's own "Initial support" list is complete, partitioned
      directories included. Of its "Later" list nothing is built as an output
      format: Kafka and HTTP exist as live-stream destinations (section 35) and
      a plugin can register a writer, but neither is what this section asks
      for, and Elasticsearch and object storage have neither.
    defers:
      ["PostgreSQL", "MySQL/MariaDB", "SQL Server", "MongoDB",
       "Elasticsearch/OpenSearch", "object storage"]
  - {section: 34, state: implemented, note: "`--output-profile`, with partitioning."}
  - section: 35
    state: implemented
    note: >
      Stdout, file, syslog, HTTP, Kafka, a database and an in-memory window,
      with rates, retargeting and attainment. `db://path.db` creates a table
      per entity from the first record it sees and commits on every flush.
  - section: 36
    state: implemented
    note: >
      Every route the section lists, and a run request that takes what
      `generate` takes - per-entity counts, edge cases, assets, history and
      all six failure policies. An unknown field is refused rather than
      ignored.
